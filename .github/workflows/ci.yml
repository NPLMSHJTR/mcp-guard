name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package in editable mode with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit and integration tests
        run: python -m pytest tests/ -v

      - name: Run benchmark evaluation suite
        run: python benchmarks/evaluate_benchmark.py

      - name: Verify CLI smoke commands
        run: |
          mcp-guard rules --category security
          mcp-guard scan --cmd "python examples/hardened_mcp_server.py" --fail-on low
          mcp-guard fuzz --cmd "python examples/hardened_mcp_server.py" --fail-on-crash
